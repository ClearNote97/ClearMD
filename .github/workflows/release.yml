# The executables (feature 006, ADR-0028): built and checked on each system, then published as a
# GitHub Release when a version tag is pushed (a manual run only builds them, as artifacts).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed # uv's own Python (with tkinter), never the runner's

jobs:
  build:
    name: Executables (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # SignPath downloads the unsigned artifact with the job's token
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
          - name: linux
            os: ubuntu-22.04 # an older glibc: the binary runs on more distributions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - name: Linux build and check dependencies
        if: runner.os == 'Linux'
        # The PySide6 window (ClearMD-Qt) starts with a display: the GL and EGL libraries and the
        # xcb helpers it needs are not in its folder (the rest of Qt's libraries are).
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils xvfb
          libxcursor1 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-randr0 libxcb-render-util0
          libxcb-xinerama0 libxcb-image0
      - run: uv sync --locked --no-default-groups --group build
      - name: Build
        run: |
          uv run --no-default-groups --group build pyinstaller packaging/clearmd.spec --noconfirm
          uv run --no-default-groups --group build pyinstaller packaging/clearmd_pyside.spec --noconfirm
      # Code signing (feature 006b, ADR-0037): on SignPath, only once it is set up (the
      # SIGNPATH_* repository variables and secret); without it the build is as before.
      - name: Unsigned Windows executables, for SignPath
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clearmd-windows-unsigned
          # The Qt window's folder keeps its place: SignPath returns the files where they were.
          path: |
            dist/ClearMD.exe
            dist/clearmd-cli.exe
            dist/ClearMD-Qt/ClearMD-Qt.exe
          if-no-files-found: error
      - uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        name: Sign them (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist
      - name: Authenticode signatures are valid
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($exe in "dist/ClearMD.exe", "dist/clearmd-cli.exe", "dist/ClearMD-Qt/ClearMD-Qt.exe") {
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne "Valid") { throw "$exe is not signed: $($signature.Status)" }
            "$exe signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Product name and version inside the Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          foreach ($exe in "dist/ClearMD.exe", "dist/clearmd-cli.exe", "dist/ClearMD-Qt/ClearMD-Qt.exe") {
            $info = (Get-Item $exe).VersionInfo
            if ($info.ProductName -ne "ClearMD" -or $info.ProductVersion -ne $version) {
              throw "$exe says '$($info.ProductName)' '$($info.ProductVersion)', not 'ClearMD' '$version'"
            }
            "$exe is ClearMD $version"
          }
      - name: Check the executables (a real batch with the command line; the window opens)
        shell: bash
        run: bash packaging/check_executables.sh dist
      # The Windows installer (feature 017, ADR-0040): built from the executables above (signed, when
      # SignPath is on), installed, used and uninstalled by packaging/check_installer.ps1, then shipped.
      - name: Inno Setup 6 (the installer's compiler; pinned)
        id: inno
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner image may already have it: then that one is used. Otherwise the pinned version.
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.7.1 -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup was not found at $iscc" }
          # The compiler prints its own version first ("Inno Setup 6.x.y Command-Line Compiler").
          $banner = (& $iscc /? 2>&1 | Select-Object -First 1)
          "Inno Setup compiler: $iscc ($banner)"
          pwsh -NoProfile -File packaging/installer/inno_version.ps1
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup 6.7 or newer is needed (see above)" }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
      - name: Installer (compiled from dist/, its version from the tag or the branch)
        id: installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          ISCC: ${{ steps.inno.outputs.iscc }}
        run: |
          set -euo pipefail
          # A tag v0.12.0 gives 0.12.0; a branch gives 0.0.0-<branch with / as ->, as the zip names do.
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.0-${GITHUB_REF_NAME//\//-}"; fi
          mkdir -p dist/installer
          # The license pack of the installer: the same notices as the zip (packaging/notices.py).
          uv run --no-default-groups --group build python packaging/notices.py > dist/installer/THIRD-PARTY-NOTICES.txt
          # MSYS_NO_PATHCONV: Git Bash must not rewrite the compiler's /D option into a path.
          MSYS_NO_PATHCONV=1 "$(cygpath -u "$ISCC")" "/DAppVersion=$version" packaging/installer/clearmd.iss
          # AC-04: the same script compiled as an older version, into its own folder, so that the
          # check can install it first and then replace it with the current one (check_installer.ps1).
          mkdir -p dist/installer-old
          MSYS_NO_PATHCONV=1 "$(cygpath -u "$ISCC")" "/DAppVersion=0.0.1" "/O$(cygpath -w "$PWD/dist/installer-old")" packaging/installer/clearmd.iss
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -la dist/installer dist/installer-old
      - name: Installer checks (silent install, use, uninstall, nothing left)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File packaging/check_installer.ps1 `
            -Installer "dist/installer/ClearMD-Setup-${{ steps.installer.outputs.version }}.exe" `
            -Version "${{ steps.installer.outputs.version }}" `
            -OldInstaller "dist/installer-old/ClearMD-Setup-0.0.1.exe" `
            -OldVersion "0.0.1"
          if ($LASTEXITCODE -ne 0) { throw "The installer checks failed (see above)" }
      - name: Package
        shell: bash
        run: bash packaging/package.sh dist "${{ matrix.name }}" "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clearmd-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --title "ClearMD $GITHUB_REF_NAME"
          --notes-file packaging/RELEASE_NOTES.md
          --prerelease
