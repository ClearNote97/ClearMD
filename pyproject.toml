[project]
name = "clearmd"
version = "0.1.0"
description = "Turn documents into Markdown. 100% local: your files never leave your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolás Enrique Valencia Santiago" }]
# 3.12 floor for developers; the ceiling comes from markitdown (ADR-0004, ADR-0018).
requires-python = ">=3.12,<3.15"
dependencies = [
    # Pre-1.0: exact version, upgraded on purpose and with tests (ADR-0004).
    "markitdown[pdf,docx,pptx,xlsx]==0.1.9",
    # Per-OS configuration paths (ADR-0002, ADR-0012).
    "platformdirs>=4.13",
    # Memory of the worker process on every OS (ADR-0015).
    "psutil>=7.0",
]
# Only what is used: pylatexenc (.tex, 002), trafilatura (article mode, 004), the GUIs and
# PyInstaller arrive in their own feature, not before (ADR-0009).

[project.scripts]
clearmd = "clearmd.frontend.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "pypdf>=6",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# One README per folder, as in the template, but not inside the wheel (ADR-0014).
wheel-exclude = ["**/README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The agent/developer contract is copied verbatim across repos: ruff must not reformat its examples.
extend-exclude = ["README_AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
# The lowest supported version, so 3.13/3.14-only code is caught (ADR-0018).
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Third-party libraries without type information; each entry is justified where it is imported.
module = ["openpyxl", "openpyxl.*", "psutil"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: tests mirror src/, so file names may repeat across folders.
addopts = "-ra --import-mode=importlib"
# conftest helpers and the fixture builder are plain modules; tests import them by name.
pythonpath = ["tests", "tests/fixtures"]
