[project]
name = "clearmd"
version = "0.1.0"
description = "Turn documents into Markdown. 100% local: your files never leave your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolás Enrique Valencia Santiago" }]
# markitdown requires <3.15 (ADR-0004).
requires-python = ">=3.14,<3.15"
dependencies = [
    # Pre-1.0: exact version, upgraded on purpose and with tests (ADR-0004).
    "markitdown[pdf,docx,pptx,xlsx]==0.1.9",
    # Own .tex converter (ADR-0006).
    "pylatexenc>=2.11",
    # HTML article-mode strategy (ADR-0006).
    "trafilatura>=2.3.1",
    # Per-OS configuration paths (ADR-0002, ADR-0012).
    "platformdirs>=4.13",
]
# GUIs (ttkbootstrap, PySide6-Essentials, flet) and packaging (PyInstaller) arrive as
# extras / groups in their own phase, not before (ADR-0009).

[project.scripts]
clearmd = "clearmd.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
# The agent/developer contract is copied verbatim across repos: ruff must not reformat its examples.
extend-exclude = ["README_AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
