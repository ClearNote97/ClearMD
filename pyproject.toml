[project]
name = "clearmd"
version = "0.6.0"
description = "Turn documents into Markdown. 100% local: your files never leave your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolás Enrique Valencia Santiago" }]
# 3.12 floor for developers; the ceiling comes from markitdown (ADR-0004, ADR-0018).
requires-python = ">=3.12,<3.15"
dependencies = [
    # Encoding of .tex files that declare none (feature 002); markitdown pulls it in too.
    "charset-normalizer>=3.4",
    # Pre-1.0: exact version, upgraded on purpose and with tests (ADR-0004).
    "markitdown[docx,pptx]==0.1.9",
    "openpyxl>=3.1,<4",  # Excel, ClearMD's own converter (feature 010, ADR-0032)
    "pypdfium2>=5.14,<6",  # PDF text (feature 008, ADR-0030)
    # Per-OS configuration paths (ADR-0002, ADR-0012).
    "platformdirs>=4.13",
    # Memory of the worker process on every OS (ADR-0015).
    "psutil>=7.0",
    # Own .tex converter (ADR-0006, feature 002).
    "pylatexenc>=2.11,<3",
    # HTML article mode: finds the main content; ClearMD writes it (ADR-0025, feature 004). Pinned:
    # its extraction decides the output, as markitdown's does.
    "trafilatura==2.3.1",
    # The first GUI (feature 005, ADR-0026): themes for tkinter, and drag and drop (tkdnd inside).
    # Pinned to releases at least two weeks old.
    "ttkbootstrap==2.2.3",
    "tkinterdnd2==0.6.4",
    # The window's rounded shapes and the file icons (ADR-0027); ttkbootstrap requires it already.
    "pillow>=12.3,<13",
]
# Only what is used: the GUIs and PyInstaller arrive in their own feature, not before (ADR-0009).

[project.scripts]
clearmd = "clearmd.frontend.cli:main"

[project.gui-scripts]
# A GUI script: no console window on Windows (ADR-0026).
clearmd-ttk = "clearmd.frontend.ttk:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    "mypy>=2.4",
    "pypdf>=6",
    "markdown-it-py>=3,<5",
]
# Building the executables (feature 006, ADR-0028): only in CI and the dev container.
build = [
    "pyinstaller==6.22.3",
]

[build-system]
requires = ["uv_build>=0.11.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Supply chain: no release younger than two weeks enters the lock (2026-10-26: these two were
# published days before trafilatura was added; their previous release is used).
constraint-dependencies = [
    "lxml-html-clean<0.4.6",
    "tzlocal<5.4.5",
    # 2026-10-28 (PyInstaller, 006): these were eight days old; their predecessors are used.
    "pyinstaller-hooks-contrib<2026.9",
    "setuptools<84.1",
]

[tool.uv.build-backend]
# One README per folder, as in the template, but not inside the wheel (ADR-0014).
wheel-exclude = ["**/README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
# The agent/developer contract is copied verbatim across repos: ruff must not reformat its examples.
extend-exclude = ["README_AGENTS.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
# The lowest supported version, so 3.13/3.14-only code is caught (ADR-0018).
python_version = "3.12"
files = ["src", "tests"]
# Tests are not packages: module names come from these roots (two conftest.py files coexist).
explicit_package_bases = true
mypy_path = ["src", "tests", "tests/fixtures", "tests/benchmark"]

[[tool.mypy.overrides]]
# Third-party libraries without type information; each entry is justified where it is imported.
module = [
    "openpyxl", "openpyxl.*", "psutil", "pypdfium2", "pypdfium2.*", "pylatexenc", "pylatexenc.*", "tkinterdnd2", "tkinterdnd2.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ttkbootstrap's functions carry no annotations: the GUI (and only the GUI) may call them.
module = ["clearmd.frontend.ttk.*", "unit.frontend.ttk.*", "gui.*", "acceptance.test_005_ttk_gui"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: tests mirror src/, so file names may repeat across folders.
addopts = "-ra --import-mode=importlib"
# conftest helpers and the fixture builder are plain modules; tests import them by name.
pythonpath = ["tests", "tests/fixtures", "tests/benchmark"]
