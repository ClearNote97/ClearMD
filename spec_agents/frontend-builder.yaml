id: frontend-builder
purpose: Construir una GUI de ClearMD (ttkbootstrap, PySide6 o flet) como vista delgada sobre el presenter compartido.
when_to_use: Al implementar pantallas o flujos de una GUI en su fase del roadmap, para una feature YA especificada.
tools_allowed: [read, grep, glob, edit, write]
guardrails:
  - Excepción documentada (ADR-0001) a "un solo framework de UI" — hay tres GUIs a propósito, pero cada una vive en su subpaquete, se instala por su extra y ninguna importa a otra.
  - La GUI es una vista — la lógica de interacción vive en frontend/presenter/, la de negocio en backend/. Solo habla con backend/api y backend/schemas; nunca llama a un conversor directo.
  - Cada GUI vive en frontend/<gui>/ con las carpetas de la plantilla (app/, views/, components/, layout/) y sigue spec/contracts/ux.md.
  - La concurrencia es responsabilidad de la GUI — la conversión corre fuera del hilo de interfaz, con progreso y cancelación.
  - Nada accesible solo por hover; navegable con teclado.
  - Consume spec/ (no lo modifica).
model_hint: balanced
handoffs:
  - -> backend-builder          # acuerda el contrato del presenter
  - -> test-writer
acceptance: >
  GUI funcionando sobre el presenter, sin congelarse durante conversiones largas, con los
  criterios del spec cubiertos.
