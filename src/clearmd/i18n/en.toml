[cli.help]
description = "Turn documents into Markdown. 100% local: ClearMD never uses the internet."
paths = "files and/or folders to convert"
overwrite = "replace outputs that already exist"
skip = "keep outputs that already exist"
changed = "replace a result only when its original changed since it was written; keep the others"
recursive = "include subfolders (default: the recursive setting, on)"
output_root = "create ClearMD_Output inside DIR instead of next to each input"
html = "how to convert web pages: full (the whole page, default: the html_strategy setting) or article (only the main content)"
quiet = "show only the summary and errors"
dry_run = "show the plan and write nothing"
open = "open the results folder(s) when done"
lang = "language for this run (default: the language setting, English)"
summary_pdf = "also write the summary as a PDF, Resumen_ClearMD.pdf (default: the summary_format setting)"
summary_pdf_only = "write the summary only as a PDF, Resumen_ClearMD.pdf, with no Markdown summary"
images = "keep each document's images in a folder next to its Markdown (default: the images setting, off)"
split_parts = "split each PDF into N parts of whole pages (N ≥ 2), into ClearMD_Output/OutputSep, instead of converting"
split_pages = "split each PDF every N pages (N ≥ 1), into ClearMD_Output/OutputSep, instead of converting"
split_words = "split each PDF or Markdown file into parts of about N words (N from 500 to 1,000,000), to fit an AI"
merge = "merge every file into one, in the order given: markdown (each converted, Markdown taken as it is) or pdf (PDFs only), into ClearMD_Output/OutputUnif"
keep = "with a split: keep the PDF parts, their Markdown, or both (default: the split_keep setting, both)"

