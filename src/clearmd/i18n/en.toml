# English catalog. Same keys and placeholders as es.toml (a test enforces it).

[error.unsupported_format]
message = "ClearMD cannot convert this kind of file."
action = "Check the supported formats in the help."

[error.password_protected]
message = "This file is password-protected."
action = "Remove the password and try again."

[error.corrupt_file]
message = "This file seems to be damaged."
action = "Open it in its original program; if it opens, save a new copy and try again."

[error.conversion_failed]
message = "This file could not be converted."
action = "Open it in its own program and save it again; if it still fails, {report}"

[error.permission_denied]
message = "ClearMD cannot write in this folder."
action = "Choose another output folder."

[error.source_unreadable]
message = "ClearMD cannot open this file."
action = "Close it in any program that has it open (for example Excel) and check that you can open it, then try again."

[error.write_failed]
message = "ClearMD could not save the result of this file."
action = "If the result is open in another program, close it. Otherwise check that the disk has free space and that the names are not too long, or choose another output folder."

[error.timed_out]
message = "Converting this file stopped moving, so it was stopped."
action = "Try splitting it into smaller parts with Split."
action_other = "Open it in its program and save it as several smaller files, or as a PDF so it can be split."

[error.out_of_memory]
message = "This file needs more memory than ClearMD allows."
action = "Try splitting it into smaller files, or close other programs."
action_other = "Close other programs, or open it in its program and save it as a PDF or as several smaller files."

[error.nothing_to_merge]
message = "Fewer than two documents could be merged, so no file was written."
action = "Fix the documents that failed, or add more, and merge again."

[error.nothing_to_measure]
message = "This PDF has no text to measure: its pages are probably scanned images."
action = "Split it with \"Every N pages\" instead."

[error.worker_crashed]
message = "The converter stopped unexpectedly on this file."
action = "Open it in its own program and save it again, or split it into parts; if it keeps happening, {report}"
action_other = "Open it in its program and save it again, or as a PDF; if it keeps happening, {report}"

[error.empty_file]
message = "This file is empty: it has no content."
action = "Check that it is the right file and that it was downloaded completely."

[report]
# How to report a problem, once for every message ({report}; audit v2, B4-05).
how = "tell us about the problem in the project's community, github.com/ClearNote97/ClearMD/discussions (with a free GitHub account), or, without an account, write to nienvasa@gmail.com. Copy only the technical detail, never the whole summary: it has your files' names."

