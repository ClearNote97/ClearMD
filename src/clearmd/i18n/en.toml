ask_one = "Overwrite {target}? [y/N]: "
yes_letter = "y"
cancelling = "Cancelling… the summary is being written."
converted_with_notes = "ℹ {name} — converted with notes (see the summary)"
cancelled_before_start = "Cancelled before anything was written."
summary_not_written = "⚠ The summary in {path} could not be written (is the disk full?)."
unexpected_error = "Something unexpected went wrong and ClearMD stopped: {detail}. Your files were not changed; please report this."
