[gui.offer]
# Review and Results of Convert: the PDFs too large to convert, split instead (feature 025).
split = "Split the Large PDFs ({count})"

[merge]
# A merged file's name, without extension (feature 026): {stamp} is "2026-11-08 10-30".
name = "Merged {stamp}"
# The visible line that opens each document in a merged Markdown (audit 2026-11-08).
heading = "Document {index} of {total}: {name}"

[gui.merge]
# Step 1 of Merge (feature 026).
title = "How to Merge"
into = "Into:"
markdown = "One Markdown"
pdf = "One PDF (PDF files only)"
note = "Each document keeps its content whole. The list's order is the result's order."
into_markdown = "into one Markdown"
into_pdf = "into one PDF"

