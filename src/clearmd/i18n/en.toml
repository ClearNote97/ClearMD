# English catalog. Same keys and placeholders as es.toml (a test enforces it).

[error.unsupported_format]
message = "ClearMD cannot convert this kind of file."
action = "Check the supported formats in the help."

[error.password_protected]
message = "This PDF is password-protected."
action = "Remove the password and try again."

[error.corrupt_file]
message = "This file seems to be damaged."
action = "Open it in its original program; if it opens, save a new copy and try again."

[error.conversion_failed]
message = "This file could not be converted."
action = "See the technical detail in the summary."

[error.permission_denied]
message = "ClearMD cannot write in this folder."
action = "Choose another output folder."

[error.source_unreadable]
message = "ClearMD cannot open this file."
action = "Close it in any program that has it open (for example Excel) and check that you can open it, then try again."

[error.write_failed]
message = "ClearMD could not save the result of this file."
action = "Check that the disk has free space and that the file and folder names are not too long, or choose another output folder."

[error.timed_out]
message = "Converting this file took too long, so it was stopped."
action = "Try splitting it into smaller files."

[error.out_of_memory]
message = "This file needs more memory than ClearMD allows."
action = "Try splitting it into smaller files, or close other programs."

[error.worker_crashed]
message = "The converter stopped unexpectedly on this file."
action = "Try again; if it happens again, the file may be damaged."

[skip]
output_folder = "ClearMD output folder"
symlink = "symbolic link (not followed)"
hidden = "hidden"
lock_file = "Office lock file"
too_large = "too large"
already_markdown = "already Markdown"
zip_archive = "ZIP archives are not supported — extract them first"
unsafe_archive = "this file looks damaged or unsafe"
unsupported_format = "unsupported format"
existing_output = "output already exists (kept)"
unreadable = "cannot be read"
too_deep = "folders nested too deeply (over 100 levels)"
too_much_memory = "too big to convert (it would need about {needed} of memory; the limit is {limit})"

[cli.help]
description = "Turn documents into Markdown. 100% local: ClearMD never uses the internet."
paths = "files and/or folders to convert"
overwrite = "replace outputs that already exist"
skip = "keep outputs that already exist"
recursive = "include subfolders (default: the recursive setting, on)"
output_root = "create ClearMD_Output inside DIR instead of next to each input"
quiet = "show only the summary and errors"
dry_run = "show the plan and write nothing"
open = "open the results folder(s) when done"
lang = "language for this run (default: the language setting, English)"

[cli]
progress = "[{index}/{total}] {name}"
failed = "✗ {name} — {message}"
skipped = "– {name} — {reason}"
input_not_found = "Not found: {path}"
no_valid_input = "Nothing to convert: none of the inputs exists."
nothing_to_convert = "Nothing to convert."
decision_required = "{count} output(s) already exist. Run again with --overwrite or --skip."
summary = "{converted} converted · {skipped} skipped · {failed} failed"
summary_stopped = " · {stopped} stopped"
stopped = "⏹ {name} — stopped after {elapsed} (about {percent}% by the estimate). {action}"
hint_output_root = "Tip: use --output-root DIR to write the results into another folder."
results = "Results: {path}"
dry_run_item = "{source} → {target}"
dry_run_exists = " (already exists)"
dry_run_done = "Dry run: nothing was written. {count} file(s) would be converted."
ask_existing = "{count} output(s) already exist. 1) Overwrite all  2) Skip all (keep them)  3) Decide one by one. Choose 1, 2 or 3: "
ask_one = "Overwrite {target}? [y/N]: "
yes_letter = "y"
cancelling = "Cancelling… the summary is being written."
cancelled_before_start = "Cancelled before anything was written."
time_left = "{duration} left"
warning_slow = "⚠ {name} — may take more than {limit} ({estimate}) and be stopped"

[time]
under_a_minute = "less than a minute"
exact_minutes = "{minutes} min"
under_a_second = "<1 s"
seconds = "{seconds} s"
minutes = "about {minutes} min"
hours = "about {hours} h {minutes} min"

[number]
decimal_mark = "."

[summary]
title = "ClearMD summary"
converted = "Converted"
stopped = "Stopped"
failed = "Failed"
skipped = "Skipped"
kept = "Kept (the output already existed)"
cancelled = "Cancelled"
history = "History"
history_restarted = "The previous history could not be read, so it starts again here."
col_source = "Source"
col_output = "Output"
col_format = "Format"
col_time = "Time"
by_content = "{format}, detected by content"
technical_detail = "Technical detail"
stopped_line = "stopped after {elapsed} (about {percent}% by the estimate). {action}"
batch_cancelled = "cancelled"

[settings]
unknown_key = "Settings: unknown setting “{setting}” ignored."
invalid_value = "Settings: invalid value for “{setting}”; using its default."
unreadable = "Settings: {setting} could not be read; using the defaults."
