[skip_action]
output_folder = "ClearMD does not convert its own results."
symlink = "Convert the original file."
hidden = "Make it visible to convert it."
lock_file = "It is deleted when the document closes."
too_large = "Split it into smaller files."
already_markdown = "It needs no conversion."
zip_archive = "Extract it and convert its contents."
archive_too_large = "If you trust it, save a new copy from its program."
archive_ratio = "If you trust it, save a new copy from its program."
archive_entries = "If you trust it, save a new copy from its program."
unsupported_format = "See the supported formats in the help."
existing_output = "Choose overwrite to replace it (CLI: --overwrite)."
unreadable = "Check that it exists and that you can open it."
too_deep = "Move it to a shallower folder."
too_much_memory = "Split it into smaller files."
too_much_memory_for_article = "Convert it with --html full (markitdown's whole page, without this mode's guarantee)."

[stop]
timed_out = "Exceeded the time limit ({limit})."
out_of_memory = "Exceeded the memory limit ({limit})."

[cli.help]
description = "Turn documents into Markdown. 100% local: ClearMD never uses the internet."
paths = "files and/or folders to convert"
overwrite = "replace outputs that already exist"
skip = "keep outputs that already exist"
recursive = "include subfolders (default: the recursive setting, on)"
output_root = "create ClearMD_Output inside DIR instead of next to each input"
html = "how to convert web pages: full (the whole page, default: the html_strategy setting) or article (only the main content)"
quiet = "show only the summary and errors"
dry_run = "show the plan and write nothing"
open = "open the results folder(s) when done"
lang = "language for this run (default: the language setting, English)"

[cli]
progress = "[{index}/{total}] {name}"
