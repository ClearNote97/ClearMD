[gui.help]
title = "How to Use ClearMD"
# Help (audit 2026-11-08): built by presenter/screens/help.py; {next}, {convert}, {split} and
# {merge} are the buttons' real names, and {drop} the sentence about dropping when the window can.
markdown_title = "What Markdown Is"
markdown = "Plain text, ordered with headings, lists and tables, that AIs read better than a PDF or a Word file. A .md file opens in Notepad or any text editor."
how_title = "How to Use It"
how = "1. On Home, choose a tool: Convert, Split or Merge.\n2. Add files or a folder with the buttons{drop}, and press {next}.\n3. Review what will happen to each file and press {next}.\n4. Press {convert}, {split} or {merge}: only then are the results written.\n5. Results shows where they are and lets you choose what is next."
how_drop = ", or drop them on the window"
tools_title = "The Three Tools"
tools = "Convert: turns each document into Markdown (folder OutputMD).\nSplit: cuts a PDF, Markdown, text, CSV or Excel file into smaller parts, for example to fit an AI (folder OutputSep).\nMerge: joins several documents, in the list's order, into one Markdown or one PDF (folder OutputUnif)."
formats_title = "What It Converts"
formats = "PDF, Word (.docx), PowerPoint (.pptx), Excel (.xlsx), OpenDocument text (.odt), LaTeX (.tex), web pages (.html), CSV, EPUB, Jupyter notebooks (.ipynb), plain text (.txt), e-mails (.eml), Rich Text (.rtf) and subtitles (.srt, .vtt).\nIt does not read text inside images or scanned pages. Old Word, Excel and PowerPoint files (.doc, .xls, .ppt) are opened in their program and saved as .docx, .xlsx or .pptx."
where_title = "Where the Results Go"
where = "In a ClearMD_Output folder next to each file or folder you chose, or in the folder you choose in step 1. Inside, each tool has its folder, and a summary (Resumen_ClearMD) says what happened to each file. Your originals are never changed."
