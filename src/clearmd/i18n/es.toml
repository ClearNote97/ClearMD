# Catálogo en español. Mismas claves y placeholders que en.toml (un test lo verifica).

[error.unsupported_format]
message = "ClearMD no puede convertir este tipo de archivo."
action = "Revisa los formatos compatibles en la ayuda."

[error.password_protected]
message = "Este PDF está protegido con contraseña."
action = "Quítale la contraseña e inténtalo de nuevo."

[error.corrupt_file]
message = "Este archivo parece estar dañado."
action = "Ábrelo en su programa original; si abre, guarda una copia nueva e inténtalo otra vez."

[error.conversion_failed]
message = "No se pudo convertir este archivo."
action = "Revisa el detalle técnico en el resumen."

[error.permission_denied]
message = "ClearMD no puede escribir en esta carpeta."
action = "Elige otra carpeta de salida."

[error.timed_out]
message = "La conversión de este archivo tardó demasiado y se detuvo."
action = "Prueba dividiéndolo en archivos más pequeños."

[error.out_of_memory]
message = "Este archivo necesita más memoria de la que ClearMD permite."
action = "Prueba dividiéndolo en archivos más pequeños o cierra otros programas."

[error.worker_crashed]
message = "El conversor se detuvo de forma inesperada con este archivo."
action = "Inténtalo de nuevo; si vuelve a pasar, puede que el archivo esté dañado."

[skip]
output_folder = "carpeta de resultados de ClearMD"
symlink = "enlace simbólico (no se sigue)"
hidden = "oculto"
lock_file = "archivo de bloqueo de Office"
too_large = "demasiado grande"
already_markdown = "ya es Markdown"
zip_archive = "los archivos ZIP no se admiten — descomprímelos primero"
unsafe_archive = "este archivo parece dañado o inseguro"
unsupported_format = "formato no compatible"
existing_output = "el resultado ya existe (se conserva)"
unreadable = "no se puede leer (permiso denegado)"
too_much_memory = "demasiado grande para convertir (necesitaría unos {needed} de memoria; el límite es {limit})"

[cli.help]
description = "Convierte documentos a Markdown. 100% local: ClearMD nunca usa internet."
paths = "archivos y/o carpetas para convertir"
overwrite = "reemplazar los resultados que ya existen"
skip = "conservar los resultados que ya existen"
no_recursive = "solo el primer nivel de las carpetas de entrada"
output_root = "crear ClearMD_Output dentro de DIR en vez de junto a cada entrada"
quiet = "mostrar solo el resumen y los errores"

[cli]
progress = "[{index}/{total}] {name}"
failed = "✗ {name} — {message}"
skipped = "– {name} — {reason}"
input_not_found = "No existe: {path}"
no_valid_input = "Nada que convertir: ninguna de las entradas existe."
nothing_to_convert = "Nada que convertir."
decision_required = "Ya existen {count} resultado(s). Vuelve a ejecutar con --overwrite o --skip."
summary = "{converted} convertidos · {skipped} omitidos · {failed} con error"
summary_stopped = " · {stopped} detenidos"
stopped = "⏹ {name} — se detuvo a los {elapsed} (iba aprox. en el {percent} % según la estimación). {action}"
hint_output_root = "Consejo: usa --output-root DIR para guardar los resultados en otra carpeta."
results = "Resultados: {path}"
time_left = "faltan {duration}"
warning_slow = "⚠ {name} — podría tardar más de {limit} ({estimate}) y detenerse"

[time]
under_a_minute = "menos de un minuto"
exact_minutes = "{minutes} min"
under_a_second = "<1 s"
seconds = "{seconds} s"
minutes = "unos {minutes} min"
hours = "unas {hours} h {minutes} min"

[number]
decimal_mark = ","

[summary]
title = "Resumen de ClearMD"
converted = "Convertidos"
stopped = "Detenidos"
failed = "Con error"
skipped = "Omitidos"
kept = "Conservados (el resultado ya existía)"
cancelled = "Cancelados"
history = "Historial"
history_restarted = "El historial anterior no se pudo leer, así que empieza de nuevo aquí."
col_source = "Origen"
col_output = "Resultado"
col_format = "Formato"
col_time = "Tiempo"
by_content = "{format}, detectado por su contenido"
technical_detail = "Detalle técnico"
stopped_line = "se detuvo a los {elapsed} (iba aprox. en el {percent} % según la estimación). {action}"
batch_cancelled = "cancelado"
