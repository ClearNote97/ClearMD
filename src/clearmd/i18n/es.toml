[gui.help]
title = "Cómo Usar ClearMD"
# La Ayuda (auditoría 2026-11-08): la arma presenter/screens/help.py; {next}, {convert}, {split}
# y {merge} son los nombres reales de los botones, y {drop} la frase de soltar cuando la ventana
# lo permite.
markdown_title = "Qué Es Markdown"
markdown = "Texto simple, ordenado con títulos, listas y tablas, que las IA leen mejor que un PDF o un Word. Un archivo .md se abre con el Bloc de notas o con cualquier editor de texto."
how_title = "Cómo se Usa"
how = "1. En el Inicio, elige una herramienta: Convertir, Dividir o Unir.\n2. Agrega archivos o una carpeta con los botones{drop}, y pulsa {next}.\n3. Revisa lo que va a pasar con cada archivo y pulsa {next}.\n4. Pulsa {convert}, {split} o {merge}: solo entonces se escriben los resultados.\n5. En Resultados ves dónde quedaron y eliges qué sigue."
how_drop = ", o suéltalos en la ventana"
tools_title = "Las Tres Herramientas"
tools = "Convertir: pasa cada documento a Markdown (carpeta OutputMD).\nDividir: corta un PDF, Markdown, texto, CSV o Excel en partes más pequeñas, por ejemplo para que quepan en una IA (carpeta OutputSep).\nUnir: junta varios documentos, en el orden de la lista, en un solo Markdown o un solo PDF (carpeta OutputUnif)."
formats_title = "Qué Convierte"
formats = "PDF, Word (.docx), PowerPoint (.pptx), Excel (.xlsx), texto OpenDocument (.odt), LaTeX (.tex), páginas web (.html), CSV, EPUB, cuadernos Jupyter (.ipynb), texto plano (.txt), correos (.eml), texto enriquecido (.rtf) y subtítulos (.srt, .vtt).\nNo lee el texto dentro de imágenes ni de páginas escaneadas. Los Word, Excel y PowerPoint antiguos (.doc, .xls, .ppt) se abren en su programa y se guardan como .docx, .xlsx o .pptx."
where_title = "Dónde Quedan los Resultados"
where = "En una carpeta ClearMD_Output junto a cada archivo o carpeta que elegiste, o en la carpeta que elijas en el paso 1. Dentro, cada herramienta usa su carpeta, y un resumen (Resumen_ClearMD) dice qué pasó con cada archivo. Tus originales nunca se modifican."
ai_title = "Usarlo con Tu IA"
ai = "Adjunta el archivo .md a tu conversación con la IA, o abre el archivo y pega su texto. Si lo dividiste, entrégale las partes en orden, una por una. Antes, mira el resumen: dice qué conviene revisar."
privacy_title = "Tu Privacidad"
privacy = "100 % local: ClearMD nunca usa internet. Tus documentos nunca salen de tu computador."
language_title = "Idioma · Language"
language = "Cambia el idioma en Ajustes. · Change the language in Settings (Ajustes → Idioma)."
close = "Cerrar"
version = "ClearMD {version}"
keyboard_title = "Teclado"
keyboard = "Ctrl+1 … Ctrl+4 abre un paso · Enter pulsa el botón en el que estás, o si no, ejecuta la acción principal · Espacio marca un archivo · Ctrl+A marca todos y Supr quita los marcados, en la lista · Esc cierra una ventana.\n¿Usas un lector de pantalla? La App Moderna es la que mejor funciona con uno: está en ClearMD-Setup-Full."

