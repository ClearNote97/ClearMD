# Catálogo en español. Mismas claves y placeholders que en.toml (un test lo verifica).

[error.unsupported_format]
message = "ClearMD no puede convertir este tipo de archivo."
action = "Revisa los formatos compatibles en la ayuda."

[error.password_protected]
message = "Este archivo está protegido con contraseña."
action = "Quítale la contraseña e inténtalo de nuevo."

[error.corrupt_file]
message = "Este archivo parece estar dañado."
action = "Ábrelo en su programa original; si abre, guarda una copia nueva e inténtalo otra vez."

[error.conversion_failed]
message = "No se pudo convertir este archivo."
action = "Ábrelo en su programa original y guárdalo de nuevo; si sigue fallando, {report}"

[error.permission_denied]
message = "ClearMD no puede escribir en esta carpeta."
action = "Elige otra carpeta de salida."

[error.source_unreadable]
message = "ClearMD no puede abrir este archivo."
action = "Ciérralo en cualquier programa que lo tenga abierto (por ejemplo Excel) y comprueba que puedes abrirlo; luego inténtalo de nuevo."

[error.write_failed]
message = "ClearMD no pudo guardar el resultado de este archivo."
action = "Si el resultado está abierto en otro programa, ciérralo. Si no, comprueba que el disco tenga espacio libre y que los nombres no sean demasiado largos, o elige otra carpeta de salida."

[error.timed_out]
message = "La conversión de este archivo dejó de avanzar, así que se detuvo."
action = "Prueba dividiéndolo con Dividir en partes más pequeñas."
action_other = "Ábrelo en su programa y guárdalo en varios archivos más pequeños, o como PDF para poder dividirlo."

[error.out_of_memory]
message = "Este archivo necesita más memoria de la que ClearMD permite."
action = "Prueba dividiéndolo en archivos más pequeños o cierra otros programas."
action_other = "Cierra otros programas, o ábrelo en su programa y guárdalo como PDF o en varios archivos más pequeños."

[error.nothing_to_merge]
message = "Se pudieron unir menos de dos documentos, así que no se escribió ningún archivo."
action = "Arregla los documentos que fallaron, o agrega más, y vuelve a unir."

[error.nothing_to_measure]
message = "Este PDF no tiene texto para medir: sus páginas seguramente son imágenes escaneadas."
action = "Divídelo mejor con «Cada N páginas»."

[error.worker_crashed]
message = "El conversor se detuvo de forma inesperada con este archivo."
action = "Ábrelo en su programa y guárdalo de nuevo, o divídelo en partes; si sigue pasando, {report}"
action_other = "Ábrelo en su programa y guárdalo de nuevo, o como PDF; si sigue pasando, {report}"

[error.empty_file]
message = "Este archivo está vacío: no tiene contenido."
action = "Revisa que sea el archivo correcto y que se haya descargado completo."

[error.empty_result]
message = "ClearMD no encontró texto que leer en este archivo, así que no escribió un resultado vacío."
action = "Si son páginas escaneadas (fotos de un documento), pásalo antes por un programa que reconozca el texto (OCR) y convierte el resultado. Si no, revisa que el archivo tenga contenido."

[report]
# Cómo reportar un problema, una sola vez para todos los mensajes ({report}; auditoría v2, B4-05).
how = "cuéntanos el problema en la comunidad del proyecto, github.com/ClearNote97/ClearMD/discussions (con una cuenta gratuita de GitHub), o, si no tienes cuenta, escríbenos a nienvasa@gmail.com. Copia solo el detalle técnico, nunca el resumen completo: tiene los nombres de tus archivos."

