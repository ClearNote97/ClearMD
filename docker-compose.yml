# =============================================================================
# ClearMD - Entorno de desarrollo
# Un solo servicio: el contenedor de desarrollo. ClearMD no usa base de datos
# (ADR-0002) y el contenedor solo corre núcleo, CLI, tests y build Linux (ADR-0008).
# APP_NAME (del .env) lo fija el initializeCommand con el nombre de la carpeta.
# =============================================================================

services:
  app-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        # Pasa APP_NAME del .env al Dockerfile para crear el WORKDIR
        APP_NAME: ${APP_NAME:-clearmd}
    container_name: ${APP_NAME:-clearmd}_dev
    env_file: [.env]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    # El código se monta aquí (no en devcontainer.json) para que Docker mande sobre VS Code.
    volumes:
      - .:/workspaces/${APP_NAME:-clearmd}:cached
    working_dir: /workspaces/${APP_NAME:-clearmd}
    command: sleep infinity
    stdin_open: true
    tty: true
