# =============================================================================
# ClearMD - Development environment
# A single service: the development container. ClearMD has no database (ADR-0002)
# and the container only runs core, CLI, tests and the Linux build (ADR-0008).
# APP_NAME (in .env) is set to the folder name by the devcontainer initializeCommand.
# =============================================================================

services:
  app-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        # Passes APP_NAME from .env to the Dockerfile to create the WORKDIR
        APP_NAME: ${APP_NAME:-clearmd}
    container_name: ${APP_NAME:-clearmd}_dev
    env_file: [.env]
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    # The code is mounted here (not in devcontainer.json) so Docker, not VS Code, owns the mount.
    volumes:
      - .:/workspaces/${APP_NAME:-clearmd}:cached
    working_dir: /workspaces/${APP_NAME:-clearmd}
    command: sleep infinity
    stdin_open: true
    tty: true
